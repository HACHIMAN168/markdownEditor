<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown 笔记</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@latest/build/styles/github-dark.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="mobile-toolbar">
    <button type="button" id="btn-back-list" class="mtb-btn">列表</button>
    <button type="button" id="btn-toggle-view" class="mtb-btn">预览</button>
  </header>

  <aside class="sidebar">
    <div class="sidebar-header">
      <input type="search" id="search-input" placeholder="搜索笔记">
    </div>
    <ul class="note-list" id="note-list"></ul>
    <div class="sidebar-footer">
      <button type="button" id="btn-new" class="btn-add" title="新建笔记">+</button>
    </div>
  </aside>

  <main class="editor">
    <input type="text" id="note-title" class="note-title" placeholder="笔记标题">
    <textarea id="note-content" class="note-content" placeholder="在这里输入 Markdown 内容..."></textarea>
  </main>

  <section class="preview">
    <article id="preview-area" class="preview-area"></article>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@latest/build/highlight.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
